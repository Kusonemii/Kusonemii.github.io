<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity Web Player | CardGame1</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
    <style>
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #000; }
      #unity-container.unity-desktop, #unity-container.unity-mobile {
        position: fixed; transform: none; width: auto; height: auto;
      }
      #unity-canvas { display: block; touch-action: none; }
      #unity-footer { display: flow-root; height: 38px; }
      .unity-mobile #unity-footer { display: none; }
    </style>
  </head>
  <body>
    <div id="unity-container" class="unity-desktop">
      <canvas id="unity-canvas" width=1920 height=1080 tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"> </div>
      <div id="unity-footer">
        <div id="unity-logo-title-footer"></div>
        <div id="unity-fullscreen-button"></div>
        <div id="unity-build-title">CardGame1</div>
      </div>
    </div>
    <script>
      var canvas = document.querySelector("#unity-canvas");

      // Shows a temporary message banner/ribbon for a few seconds, or
      // a permanent error message on top of the canvas if type=='error'.
      // If type=='warning', a yellow highlight color is used.
      // Modify or remove this function to customize the visually presented
      // way that non-critical warnings and error messages are presented to the
      // user.
      function unityShowBanner(msg, type) {
        var warningBanner = document.querySelector("#unity-warning");
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/Build.loader.js";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/Build.data.unityweb",
        frameworkUrl: buildUrl + "/Build.framework.js.unityweb",
        codeUrl: buildUrl + "/Build.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "CardGame1",
        productVersion: "1.0",
        showBanner: unityShowBanner,
        // errorHandler: function(err, url, line) {
        //    alert("error " + err + " occurred at line " + line);
        //    // Return 'true' if you handled this error and don't want Unity
        //    // to process it further, 'false' otherwise.
        //    return true;
        // },
      };

      // By default, Unity keeps WebGL canvas render target size matched with
      // the DOM size of the canvas element (scaled by window.devicePixelRatio)
      // Set this to false if you want to decouple this synchronization from
      // happening inside the engine, and you would instead like to size up
      // the canvas DOM size and WebGL render target sizes yourself.
      // config.matchWebGLToCanvasSize = false;

      // If you would like all file writes inside Unity Application.persistentDataPath
      // directory to automatically persist so that the contents are remembered when
      // the user revisits the site the next time, uncomment the following line:
      // config.autoSyncPersistentDataPath = true;
      // This autosyncing is currently not the default behavior to avoid regressing
      // existing user projects that might rely on the earlier manual
      // JS_FileSystem_Sync() behavior, but in future Unity version, this will be
      // expected to change.

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        // Mobile device style: fill the whole browser client area with the game canvas:

        document.querySelector("#unity-container").className = "unity-mobile";
        canvas.className = "unity-mobile";

        // To lower canvas resolution on mobile devices to gain some
        // performance, uncomment the following line:
        // config.devicePixelRatio = 1;


      } else {
        // Desktop style: Render the game canvas in a window that can be maximized to fullscreen:
        // Canvas sizing is shared with mobile below.
      }

      // Fit a 16:9 game area to the visible viewport without CSS transforms.
      // Unity synchronizes its render target and input with the canvas size.
      config.matchWebGLToCanvasSize = true;
      var resizeFrame = 0;
      function resizeUnityCanvas() {
        resizeFrame = 0;
        if (!canvas || document.fullscreenElement) return;
        var viewport = window.visualViewport;
        var width = viewport ? viewport.width : window.innerWidth;
        var height = viewport ? viewport.height : window.innerHeight;
        var left = viewport ? viewport.offsetLeft : 0;
        var top = viewport ? viewport.offsetTop : 0;
        var container = document.querySelector("#unity-container");
        var footer = document.querySelector("#unity-footer");
        var footerHeight = footer ? footer.offsetHeight : 0;
        var scale = Math.max(0, Math.min(width / 16, (height - footerHeight) / 9));
        var canvasWidth = scale * 16;
        var canvasHeight = scale * 9;
        canvas.style.width = canvasWidth + "px";
        canvas.style.height = canvasHeight + "px";
        container.style.width = canvasWidth + "px";
        container.style.height = (canvasHeight + footerHeight) + "px";
        container.style.left = (left + (width - canvasWidth) / 2) + "px";
        container.style.top = (top + (height - canvasHeight - footerHeight) / 2) + "px";
      }
      function scheduleUnityResize() {
        if (!resizeFrame) resizeFrame = requestAnimationFrame(resizeUnityCanvas);
      }
      function stopUnityResize() {
        window.removeEventListener("resize", scheduleUnityResize);
        window.removeEventListener("orientationchange", scheduleUnityResize);
        document.removeEventListener("fullscreenchange", scheduleUnityResize);
        if (window.visualViewport) {
          window.visualViewport.removeEventListener("resize", scheduleUnityResize);
          window.visualViewport.removeEventListener("scroll", scheduleUnityResize);
        }
        if (resizeFrame) cancelAnimationFrame(resizeFrame);
        resizeFrame = 0;
      }
      window.addEventListener("resize", scheduleUnityResize);
      window.addEventListener("orientationchange", scheduleUnityResize);
      document.addEventListener("fullscreenchange", scheduleUnityResize);
      if (window.visualViewport) {
        window.visualViewport.addEventListener("resize", scheduleUnityResize);
        window.visualViewport.addEventListener("scroll", scheduleUnityResize);
      }
      window.addEventListener("load", scheduleUnityResize);
      resizeUnityCanvas();

      document.querySelector("#unity-loading-bar").style.display = "block";

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          document.querySelector("#unity-progress-bar-full").style.width = 100 * progress + "%";
              }).then((unityInstance) => {
                document.querySelector("#unity-loading-bar").style.display = "none";
                document.querySelector("#unity-fullscreen-button").onclick = () => {
                  unityInstance.SetFullscreen(1);
                };

              }).catch((message) => {
                alert(message);
              });
            };

      document.body.appendChild(script);

    </script>
  </body>
</html>
